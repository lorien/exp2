name: opencode
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  opencode:
    if: >-
      (github.event_name == 'issues' && startsWith(github.event.issue.body, '/oc ')) ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/oc '))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode-go/deepseek-v4-flash
          use_github_token: true
          share: false
          prompt: |
            You are responding to the GitHub issue that triggered this workflow.
            Do NOT post any comments, create branches, or use any GitHub tools.
            Your final reply will be posted automatically as a comment by the system.
            Reply with exactly this text and nothing else:
            I see