name: opencode
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  opencode:
    if: >-
      (github.event_name == 'issues' && startsWith(github.event.issue.body, '/agent:')) ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/agent:'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    timeout-minutes: 30
    concurrency:
      group: >-
        opencode-issue-${{ github.event.issue.number }}-${{
          ((github.event_name == 'issues' &&
            (startsWith(github.event.issue.body, '/agent:research') ||
             startsWith(github.event.issue.body, '/agent:implement'))) ||
           (github.event_name == 'issue_comment' &&
            (startsWith(github.event.comment.body, '/agent:research') ||
             startsWith(github.event.comment.body, '/agent:implement'))))
          && 'run' || github.run_id }}
      cancel-in-progress: true
    steps:
      - name: Detect mode
        id: detect
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const body =
              context.eventName === 'issue_comment'
                ? context.payload.comment?.body ?? ''
                : context.payload.issue?.body ?? ''
            const [firstLine, ...rest] = body.split('\n')
            const command = firstLine.trim()
            const mode =
              command === '/agent:research'
                ? 'research'
                : command === '/agent:implement'
                  ? 'implement'
                  : 'invalid'
            core.setOutput('mode', mode)
            const request = rest.join('\n').trim()
            core.setOutput('request', request || '(no additional details were provided)')

      - uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config --global user.name "opencode-agent[bot]"
          git config --global user.email "opencode-agent[bot]@users.noreply.github.com"

      - name: Check actor has write or higher access
        id: check_access
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            if (context.actor.toLowerCase() === context.repo.owner.toLowerCase()) return 'true'
            try {
              await github.rest.repos.checkCollaborator({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: context.actor,
                permission: 'push',
              })
              return 'true'
            } catch (e) {
              if (e.status === 404) return 'false'
              throw e
            }

      - name: Post queued status
        id: status-queued
        if: >-
          steps.check_access.outputs.result == 'true' &&
          (steps.detect.outputs.mode == 'research' || steps.detect.outputs.mode == 'implement')
        uses: actions/github-script@v7
        with:
          script: |
            const mode = '${{ steps.detect.outputs.mode }}'
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = [
              `**opencode run queued** — \`/agent:${mode}\``,
              'Status: queued',
              `[View run logs](${runUrl})`,
            ].join('\n')
            const comment = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            })
            core.setOutput('comment_id', comment.data.id)

      - name: Post running status
        id: status-running
        if: >-
          steps.check_access.outputs.result == 'true' &&
          (steps.detect.outputs.mode == 'research' || steps.detect.outputs.mode == 'implement')
        uses: actions/github-script@v7
        with:
          script: |
            const commentId = Number('${{ steps.status-queued.outputs.comment_id }}')
            if (!commentId) return
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = [
              '**opencode run in progress**',
              'Status: running',
              `[View run logs](${runUrl})`,
            ].join('\n')
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              body,
            })

      - name: Research mode
        id: research
        if: steps.check_access.outputs.result == 'true' && steps.detect.outputs.mode == 'research'
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode-go/deepseek-v4-flash
          use_github_token: true
          share: false
          prompt: |
            You are researching the GitHub issue that triggered this workflow.
            Do NOT post any comments, create branches, or use any GitHub tools.
            You may use read-only git commands for research (e.g. git log, git diff, git status, git show, git blame).
            Do NOT run git commands that change the repository state: no git commit, git push, git checkout, git branch, git reset, git rebase, git merge, git stash, git clean, git tag.
            Investigate the codebase and the issue, then propose concrete changes in your final reply.
            Your final reply will be posted automatically as a comment by the system.

            The following is the verbatim text of the message that triggered this run
            (the command line itself was removed):
            <user_request>
            ${{ steps.detect.outputs.request }}
            </user_request>

      - name: Implement mode
        id: implement
        if: steps.check_access.outputs.result == 'true' && steps.detect.outputs.mode == 'implement'
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode-go/deepseek-v4-flash
          use_github_token: true
          share: false
          prompt: |
            You are responding to the GitHub issue that triggered this workflow.
            Do NOT create branches or pull requests, and do NOT use any GitHub tools.
            You may use read-only git commands for research (e.g. git log, git diff, git status, git show, git blame).
            Do NOT run git commands that change the repository state: no git commit, git push, git checkout, git branch, git reset, git rebase, git merge, git stash, git clean, git tag.
            If the requirements in the issue are clear:
              - Implement the changes discussed in the issue by editing the code.
              - The system will automatically commit your changes and open a pull request.
              - Your final reply should briefly summarize what you implemented.
            If anything is unclear or ambiguous:
              - Do NOT make any code changes.
              - Put your follow-up questions in your final reply.
              - Your final reply will be posted automatically as a comment on the issue by the system.

            The following is the verbatim text of the message that triggered this run
            (the command line itself was removed):
            <user_request>
            ${{ steps.detect.outputs.request }}
            </user_request>

      - name: Post final status
        id: status-final
        if: >-
          always() && steps.check_access.outputs.result == 'true' &&
          (steps.detect.outputs.mode == 'research' || steps.detect.outputs.mode == 'implement')
        uses: actions/github-script@v7
        with:
          script: |
            const commentId = Number('${{ steps.status-queued.outputs.comment_id }}')
            if (!commentId) return
            const researchOutcome = '${{ steps.research.outcome }}'
            const implementOutcome = '${{ steps.implement.outcome }}'
            const activeOutcome = researchOutcome !== 'skipped' ? researchOutcome : implementOutcome
            const status =
              activeOutcome === 'success'
                ? 'done'
                : activeOutcome === 'cancelled'
                  ? 'cancelled'
                  : 'failed'
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = [
              `**opencode run ${status}**`,
              `Status: ${status}`,
              `[View run logs](${runUrl})`,
            ].join('\n')
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              body,
            })

      - name: Invalid mention
        if: steps.check_access.outputs.result == 'true' && steps.detect.outputs.mode == 'invalid'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Invalid mention. Supported commands: `/agent:research`, `/agent:implement`.',
            })